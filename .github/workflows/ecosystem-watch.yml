name: Ecosystem watch

# OpenCode's Ecosystem page, where community plugins are listed, exists only
# in its V1 docs, and its maintainers have said it is being replaced. This
# watch goes red the day a replacement appears, so the plugin is submitted
# there early. When it does: submit the plugin by the new page's rules, then
# delete this file, which has nothing left to watch.

on:
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: OpenCode's V2 docs have no ecosystem page yet
        # Two signals, either enough: a page in the V2 docs source whose name
        # reads as a listing of community work, or the ecosystem URL no
        # longer landing on the V1 page.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(gh api repos/anomalyco/opencode/contents/services/site/src/docs --jq '.[] | select(.name == "content").sha')
          pages=$(gh api "repos/anomalyco/opencode/git/trees/$sha?recursive=1" --jq '.tree[].path' \
            | grep -i -E 'ecosystem|community|directory|marketplace|showcase|catalog' || true)
          landing=$(curl -sL -o /dev/null -w '%{url_effective}' https://opencode.ai/v2/docs/ecosystem)
          if [ -n "$pages" ] || [ "$landing" != "https://opencode.ai/v1/docs/ecosystem" ]; then
            echo "::error::OpenCode has a new place for community plugins. V2 docs pages: ${pages:-none}. The ecosystem URL lands on: $landing. Submit the plugin there, then delete this workflow."
            exit 1
          fi
          echo "No replacement yet: the ecosystem URL still lands on the V1 page."

  notify:
    needs: [watch]
    if: failure() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Post to the alerts channel
        env:
          ALERTS_WEBHOOK: ${{ secrets.ALERTS_WEBHOOK }}
        run: |
          MESSAGE="🔔 OpenCode's ecosystem page has a replacement: submit opencode-shipstatic there, then delete ecosystem-watch.yml"
          [ -n "$ALERTS_WEBHOOK" ] || { echo "::error::ALERTS_WEBHOOK is not set on this repository, so this outcome reached nobody"; exit 1; }
          curl --fail-with-body -sS --form-string "content=$MESSAGE <$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID>" "$ALERTS_WEBHOOK"
